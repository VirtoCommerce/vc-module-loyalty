<div class="blade-content">
  <div class="blade-inner">
    <div class="inner-block clearfix">
      <form class="form" name="formScope">
        <legend>{{ 'Loyalty.blades.filter-detail.labels.criteria' | translate }}</legend>

        <div class="form-group" ng-init="setForm(formScope)">
          <label class="form-label">{{ 'Loyalty.blades.filter-detail.labels.name' | translate }}</label>
          <div class="form-input">
            <input ng-model="blade.currentEntity.name" required placeholder="{{ 'Loyalty.blades.filter-detail.labels.name' | translate }}" />
          </div>
        </div>

        <va-metaform registered-inputs="blade.metaFields" blade="blade" ng-init="setForm(formScope)"></va-metaform>
      </form>
    </div>
  </div>
</div>

<script type="text/ng-template" id="loyalty-filter-store-selector.html">
  <div class="form-input">
    <va-store-selector multiple ng-model="blade.currentEntity.storeIds" placeholder="'Loyalty.blades.filter-detail.placeholders.store'"></va-store-selector>
  </div>
</script>
