<div class="blade-static __bottom" ng-if="pageSettings.itemsPerPageCount < pageSettings.totalItems" ng-include="'pagerTemplate.html'"></div>
<div class="blade-content __medium-wide">
  <div class="blade-inner">
    <div class="inner-block">
      <div class="table-wrapper" ng-init="setGridOptions({
                    data: 'blade.data',
                    rowTemplate: 'loyalty-transaction-list.row.html',
                    rowHeight: 60,
                    columnDefs: [
                        { name: 'loyaltyProgramId', displayName: 'loyalty.blades.loyalty-transaction-list.labels.loyalty-program' },
                        { name: 'customerId', displayName: 'loyalty.blades.loyalty-transaction-list.labels.customer' },
                        { name: 'comment', displayName: 'loyalty.blades.loyalty-transaction-list.labels.comment' },
                        { name: 'objectType', displayName: 'loyalty.blades.loyalty-transaction-list.labels.object-type' },
                        { name: 'objectId', displayName: 'loyalty.blades.loyalty-transaction-list.labels.object' },
                        { name: 'operationType', displayName: 'loyalty.blades.loyalty-transaction-list.labels.operation-type' },
                        { name: 'points', displayName: 'loyalty.blades.loyalty-transaction-list.labels.points' },
                        { name: 'createdDate', displayName: 'loyalty.blades.loyalty-transaction-list.labels.created-date', cellFilter: 'date:\'yyyy-MM-dd HH:mm:ss\'' },
                    ]})">
        <div ui-grid="gridOptions" ui-grid-auto-resize ui-grid-save-state ui-grid-selection ui-grid-resize-columns ui-grid-move-columns ui-grid-pinning ui-grid-height> </div>

      </div>
      <div class="note" ng-if="!blade.data.length">{{ 'platform.list.no-data' | translate }}</div>
    </div>
  </div>
</div>
<script type="text/ng-template" id="loyalty-transaction-list.row.html">
  <div ng-click='grid.appScope.edit(row.entity)' ng-repeat="(colRenderIndex, col) in colContainer.renderedColumns track by col.uid" ui-grid-one-bind-id-grid="rowRenderIndex + '-' + col.uid + '-cell'" class="ui-grid-cell" ng-class="{'ui-grid-row-header-cell': col.isRowHeader, '__hovered': grid.appScope.contextMenuEntity === row.entity, '__selected': row.entity.id===grid.appScope.selectedNodeId }" role="{{col.isRowHeader ? 'rowheader' : 'gridcell' }}" ui-grid-cell context-menu="grid.appScope.contextMenuEntity = row.entity" data-target="cl_menu"></div>
</script>
