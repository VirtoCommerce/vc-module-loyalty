<div class="blade-static __bottom" ng-if="pageSettings.itemsPerPageCount < pageSettings.totalItems" ng-include="'pagerTemplate.html'"></div>

<div class="blade-content __medium-wide">
    <div class="blade-inner">
        <div class="note" ng-if="!listEntries.length">{{ 'platform.list.no-data' | translate }}</div>
        <form name="formScope">
          <div class="inner-block" ng-init="setGridOptions('loyalty-program-product-factor-list-grid', {
                useExternalSorting: true,
                data: 'listEntries',
                rowHeight: 60,
                columnDefs: [
                  { name: 'productName', displayName: 'Loyalty.blades.loyalty-program-product-factor-list.labels.product-name', cellTemplate: 'product-factor-list-name.cell.html', enableSorting: false  },
                  { name: 'productCode', displayName: 'Loyalty.blades.loyalty-program-product-factor-list.labels.product-code', enableSorting: false },
                  { name: 'factor', displayName: 'Loyalty.blades.loyalty-program-product-factor-list.labels.factor', width: 120, cellTemplate: 'loyalty-factor.cell.html' }
                ]})">
              <div class="table-wrapper" ng-if="listEntries.length" ng-init="setForm(formScope)">
                  <div ui-grid="gridOptions" ui-grid-auto-resize ui-grid-save-state ui-grid-selection ui-grid-resize-columns ui-grid-move-columns ui-grid-pinning ui-grid-height></div>
              </div>
          </div>
        </form>
    </div>
</div>

<script type="text/ng-template" id="product-factor-list-name.cell.html">
  <div class="ui-grid-cell-contents">
    <div class="inner-contents">
      <div class="table-t">{{COL_FIELD}}</div>
      <div class="table-descr">
        <div class="table-descr" ng-if="!row.entity.id">
          <span class="label">{{ 'Loyalty.blades.loyalty-program-product-factor-list.labels.new' | translate }}</span>
        </div>
      </div>
    </div>
  </div>
</script>
