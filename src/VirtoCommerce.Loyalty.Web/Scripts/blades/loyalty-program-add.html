<div class="blade-content">
    <div class="blade-inner">
        <div class="inner-block">
            <ul class="list __items">
                <li class="list-item"
                    ng-repeat="programType in blade.programTypes track by programType.type"
                    ng-click="selectType(programType)">
                    <a class="list-block">
                        <i class="list-ico fa {{programType.icon}}"></i>
                        <span class="list-name">{{programType.name | translate}}</span>
                        <span class="list-descr">{{programType.description | translate}}</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>
