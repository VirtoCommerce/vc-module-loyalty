<div class="blade-static __bottom" ng-if="pageSettings.itemsPerPageCount < pageSettings.totalItems" ng-include="'pagerTemplate.html'"></div>

<div class="blade-content __medium-wide">
    <div class="blade-inner">
        <div class="note" ng-if="!listEntries.length">{{ 'platform.list.no-data' | translate }}</div>
        <div class="inner-block" ng-init="setGridOptions('product-loyalty-program-list-grid', {
              useExternalSorting: true,
              data: 'listEntries',
              rowHeight: 60,
              columnDefs: [
                { name: 'programName', field: 'program.name', displayName: 'Loyalty.blades.product-loyalty-program-list.labels.program-name' },
                { name: 'factor', displayName: 'Loyalty.blades.product-loyalty-program-list.labels.factor', width: 120, cellTemplate: 'product-loyalty-factor.cell.html' }
              ]})">
            <div class="table-wrapper" ng-if="listEntries.length">
                <div ui-grid="gridOptions" ui-grid-auto-resize ui-grid-save-state ui-grid-selection ui-grid-resize-columns ui-grid-move-columns ui-grid-pinning ui-grid-height></div>
            </div>
        </div>
    </div>
</div>

<style>
  .ui-grid-editable .ui-grid-cell-contents {
    overflow: visible;
    width: 90px;
    padding: 10px 0 0 10px;
  }

  .ui-grid-cell .ui-grid-editable input {
    padding: 6px 10px;
    box-sizing: border-box;
  }

  .ui-grid-cell .ui-grid-editable input.ng-valid {
    border: 1px solid #dee9f0;
  }
</style>

<script type="text/ng-template" id="product-loyalty-factor.cell.html">
  <div class="ui-grid-editable">
    <div class="ui-grid-cell-contents">
      <div class="form-input">
        <input ng-model="row.entity.factor" required>
      </div>
    </div>
  </div>
</script>
