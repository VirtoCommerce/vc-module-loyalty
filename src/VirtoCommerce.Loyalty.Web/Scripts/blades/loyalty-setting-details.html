<div class="blade-content __medium-wide">
  <div class="blade-inner">
    <div class="inner-block">
      <form class="form" name="formScope">
        <fieldset ng-init="setForm(formScope)">

          <div class="form-group">
            <label class="form-label">{{'Loyalty.blades.loyalty-setting-details.labels.enabled' | translate}}</label>
            <div class="form-input">
              <label class="form-label __switch">
                <input type="checkbox" ng-model="blade.currentEntity.loyaltyEnabled">
                <span class="switch"></span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">{{'Loyalty.blades.loyalty-setting-details.labels.mode' | translate}}</label>
            <ui-scroll-drop-down page-size="50"
                                 ng-if="loyaltySettingLoaded"
                                 ng-model="blade.currentEntity.loyaltyMode"
                                 data="blade.fetchLoyaltyModes(criteria)"
                                 placeholder="'Loyalty.blades.loyalty-setting-details.placeholders.mode'">
            </ui-scroll-drop-down>
          </div>

          <div class="form-group">
            <label class="form-label">{{'Loyalty.blades.loyalty-setting-details.labels.currency' | translate}}</label>
            <ui-scroll-drop-down page-size="50"
                                 ng-if="loyaltySettingLoaded"
                                 ng-model="blade.currentEntity.loyaltyCurrency"
                                 data="blade.fetchCurrencies(criteria)"
                                 placeholder="'Loyalty.blades.loyalty-setting-details.placeholders.currency'">
            </ui-scroll-drop-down>
          </div>

        </fieldset>
      </form>
    </div>
  </div>
</div>
